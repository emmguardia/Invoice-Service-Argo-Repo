# Invoice-Service (prod)
namespace: invoice-service

imagePullSecrets:
  - name: ghcr-secret

service:
  image: ghcr.io/emmguardia/invoice-service@sha256:402020c893f4e1d8c96f03fc6d513bdbfa941e4c2632ebc1240f858e7fc6159b
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  env:
    PORT: "8080"
    NODE_ENV: production
    TEMPLATES_DIR: /app/templates
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
    # Mentions légales (art. R123-237 C. com.)
    VENDOR_SIRET: "890 865 389 00021"
    # Archivage R2 — endpoint et bucket en clair, credentials via SealedSecret
    R2_ENDPOINT: "https://07f813a5e32eb6a6c357020105e55a83.r2.cloudflarestorage.com"
    R2_BUCKET_NAME: "clos-invoices"
    R2_REGION: "auto"
    INVOICE_REQUIRE_ARCHIVE: "true"
  secretName: invoice-service-secrets
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80
  networkPolicy:
    enabled: true
    callerNamespace: clos-de-la-reine
    emailServiceNamespace: email-service
    allowR2Egress: true
