# Invoice-Service (prod)
namespace: invoice-service

imagePullSecrets:
  - name: ghcr-secret

service:
  image: ghcr.io/emmguardia/invoice-service@sha256:3414285ac4f0708491e7ecca5543d871c8660be0b562cadb1ea2a017718a3f7a
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  env:
    PORT: "8080"
    NODE_ENV: production
    TEMPLATES_DIR: /app/templates
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
  secretName: invoice-service-secrets
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
