{{- if .Values.service.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: invoice-service
  namespace: {{ include "invoice.namespace" . }}
  labels:
    {{- include "invoice.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: invoice-service
  minReplicas: {{ .Values.service.hpa.minReplicas }}
  maxReplicas: {{ .Values.service.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.service.hpa.cpuTarget }}
    {{- if .Values.service.hpa.memoryTarget }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.service.hpa.memoryTarget }}
    {{- end }}
{{- end }}
